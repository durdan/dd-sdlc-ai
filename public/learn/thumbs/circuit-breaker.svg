<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1107 892" class="dg" data-diagram="structure" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A breaker wraps every call to one dependency"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-group" data-group="cb"><rect x="24" y="227" width="915" height="406" rx="12" fill="none" stroke="#c5ccc9" stroke-dasharray="6 5"/><text x="38" y="249" class="dg-group-label" fill="#4f5d5a" font-size="13" font-weight="600">Circuit breaker [in-process library or proxy]</text></g><g class="dg-edge" data-edge="s1" data-from="caller" data-to="guard"><path d="M 380 88 L 380.2 271" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="359" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">call</text></g><g class="dg-edge" data-edge="s2" data-from="guard" data-to="state"><path d="M 322 335 L 322 520 Q 322 525 317 525 L 206.53333333333333 525 Q 201.53333333333333 525 201.53333333333333 530 L 201.53333333333333 545" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="279" y="449" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">check state</text></g><g class="dg-edge" data-edge="s3" data-from="guard" data-to="dep"><path d="M 438.4 335 L 438.4 340 Q 438.4 345 443.4 345 L 909 345 Q 914 345 914 350 L 914 772" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="984" y="709" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">forward when closed</text></g><g class="dg-edge" data-edge="s4" data-from="guard" data-to="window"><path d="M 360.79999999999995 335 L 360.79999999999995 360 Q 360.79999999999995 365 365.79999999999995 365 L 508 365 Q 513 365 513 370 L 513 413" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="422" y="388" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">record outcome and latency</text></g><g class="dg-edge" data-edge="s5" data-from="window" data-to="state"><path d="M 513 477 L 513 530 Q 513 535 508 535 L 246.73333333333335 535 Q 241.73333333333335 535 241.73333333333335 540 L 241.73333333333335 545" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="425" y="510" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">failure rate ≥ 50% → open</text></g><g class="dg-edge" data-edge="s6" data-from="state" data-to="timer"><path d="M 121.13333333333333 545 L 121.13333333333333 530 Q 121.13333333333333 525 116.13333333333333 525 L 109.66666666666666 525 Q 104.66666666666666 525 104.66666666666666 520 L 104.66666666666666 477" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="80.66666666666666" y="510" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">start</text></g><g class="dg-edge" data-edge="s7" data-from="timer" data-to="state"><path d="M 161.33333333333331 477 L 161.33333333333331 545" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="231.33333333333331" y="510" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">expires → half-open</text></g><g class="dg-edge" data-edge="s8" data-from="guard" data-to="fallback"><path d="M 399.59999999999997 335 L 399.59999999999997 350 Q 399.59999999999997 355 404.59999999999997 355 L 772 355 Q 777 355 777 360 L 777 413" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="740" y="388" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">when open</text></g><g class="dg-edge" data-edge="s9" data-from="state" data-to="metrics"><path d="M 181.43333333333334 609 L 181 772" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="134.5" y="709" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">every change</text></g><g class="dg-node" data-node="caller"><rect x="295" y="24" width="170" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="380" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Order service</text><text x="380" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">the caller</text></g><g class="dg-node" data-node="guard"><rect x="283.2" y="271" width="194" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="380.2" y="300" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Guard</text><text x="380.2" y="318" text-anchor="middle" font-size="12" fill="#4f5d5a">allow, or reject at once</text></g><g class="dg-node" data-node="window"><rect x="396" y="413" width="234" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="513" y="442" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Sliding window</text><text x="513" y="460" text-anchor="middle" font-size="12" fill="#4f5d5a">outcomes of the last 100 calls</text></g><g class="dg-node" data-node="state"><rect x="80.93333333333332" y="545" width="201" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="181.43333333333334" y="574" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">State</text><text x="181.43333333333334" y="592" text-anchor="middle" font-size="12" fill="#4f5d5a">closed · open · half-open</text></g><g class="dg-node" data-node="timer"><rect x="48" y="413" width="170" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="133" y="442" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Open timer</text><text x="133" y="460" text-anchor="middle" font-size="12" fill="#4f5d5a">e.g. 60 s</text></g><g class="dg-node" data-node="fallback"><rect x="650" y="413" width="254" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="777" y="442" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Fallback</text><text x="777" y="460" text-anchor="middle" font-size="12" fill="#4f5d5a">cached, default, or a clear error</text></g><g class="dg-node" data-node="dep"><rect x="817" y="772" width="194" height="64" rx="6" fill="#ffffff" stroke="#b9c2bf" stroke-width="1.4"/><text x="914" y="801" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Payment service</text><text x="914" y="819" text-anchor="middle" font-size="12" fill="#4f5d5a">the protected dependency</text></g><g class="dg-node" data-node="metrics"><rect x="83" y="772" width="195" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="180.5" y="801" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Metrics and alerts</text><text x="180.5" y="819" text-anchor="middle" font-size="12" fill="#4f5d5a">state changes</text></g></g></svg>