d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">charge £40</text></g><g class="dg-edge" data-edge="p4" data-from="payments" data-to="pdb"><path d="M 315 484 L 315 618" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="256" y="555" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">charge committed</text></g><g class="dg-edge" data-edge="p5" data-from="orders" data-to="inventory"><path d="M 530 286 L 530 420" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="455" y="357" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">reserve stock · fails</text></g><g class="dg-edge" data-edge="p6" data-from="orders" data-to="shipping"><path d="M 564 286 L 564 291 Q 564 296 569 296 L 743 296 Q 748 296 748 301 L 748 420" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="701.5" y="357" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">never booked</text></g><g class="dg-edge" data-edge="p7" data-from="inventory" data-to="idb"><path d="M 530 484 L 530 618" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="483.5" y="555" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">stock levels</text></g><g class="dg-edge" data-edge="p8" data-from="shipping" data-to="sdb"><path d="M 748 484 L 748 618" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="714.5" y="555" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">bookings</text></g><g class="dg-node" data-node="shopper"><