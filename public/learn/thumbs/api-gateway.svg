<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1192 892" class="dg" data-diagram="structure" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="One front door in front of every service"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-group" data-group="gw"><rect x="271" y="227" width="859" height="406" rx="12" fill="none" stroke="#c5ccc9" stroke-dasharray="6 5"/><text x="285" y="249" class="dg-group-label" fill="#4f5d5a" font-size="13" font-weight="600">API gateway [managed service or reverse proxy]</text></g><g class="dg-edge" data-edge="s1" data-from="clients" data-to="tls"><path d="M 931 88 L 931 271" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="852.5" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">HTTPS to one host name</text></g><g class="dg-edge" data-edge="s2" data-from="tls" data-to="router"><path d="M 931 335 L 931 393" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="868.5" y="368" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">decrypted request</text></g><g class="dg-edge" data-edge="s3" data-from="router" data-to="auth"><path d="M 892 457 L 892 472 Q 892 477 887 477 L 405 477 Q 400 477 400 482 L 400 545" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="357" y="520" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">check token</text></g><g class="dg-edge" data-edge="s4" data-from="auth" data-to="idp"><path d="M 400 609 L 400 772" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="328" y="709" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">signing keys, cached</text></g><g class="dg-edge" data-edge="s5" data-from="router" data-to="limit"><path d="M 931 457 L 931 482 Q 931 487 926 487 L 604 487 Q 599 487 599 492 L 599 545" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="552.5" y="520" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">check budget</text></g><g class="dg-edge" data-edge="s6" data-from="router" data-to="orders"><path d="M 853 457 L 853 462 Q 853 467 848 467 L 300 467 Q 295 467 295 472 L 295 643 Q 295 648 290 648 L 190 648 Q 185 648 185 653 L 185 772" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="103.5" y="709" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">/orders/* → one service</text></g><g class="dg-edge" data-edge="s7" data-from="router" data-to="agg"><path d="M 970 457 L 970 492 Q 970 497 965 497 L 803 497 Q 798 497 798 502 L 798 545" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="742" y="520" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">/product-page/*</text></g><g class="dg-edge" data-edge="s8" data-from="agg" data-to="catalogue"><path d="M 766.6666666666666 609 L 762 643 Q 767 648 762 648 L 628 648 Q 623 648 623 653 L 623 772" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="592.5" y="709" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">fan out</text></g><g class="dg-edge" data-edge="s9" data-from="agg" data-to="reviews"><path d="M 829.3333333333334 609 L 834 719 Q 829 724 833 724 L 833 724 Q 837 724 837 729 L 837 772" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="798.5" y="709" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">fan out</text></g><g class="dg-edge" data-edge="s10" data-from="router" data-to="obs"><path d="M 1009 457 L 1009 545" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="959.5" y="520" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">every request</text></g><g class="dg-edge" data-edge="s11" data-from="obs" data-to="metrics"><path d="M 1009 609 L 1009 719 Q 1009 724 1014 724 L 1042 724 Q 1047 724 1047 729 L 1047 772" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="982" y="709" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">export</text></g><g class="dg-node" data-node="clients"><rect x="843" y="24" width="175" height="64" rx="22" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="930.5" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Clients</text><text x="930.5" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">mobile, web, partners</text></g><g class="dg-node" data-node="tls"><rect x="827" y="271" width="208" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="931" y="300" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">TLS termination</text><text x="931" y="318" text-anchor="middle" font-size="12" fill="#4f5d5a">one certificate, one place</text></g><g class="dg-node" data-node="auth"><rect x="306" y="545" width="188" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="400" y="574" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Authentication</text><text x="400" y="592" text-anchor="middle" font-size="12" fill="#4f5d5a">validate the token once</text></g><g class="dg-node" data-node="limit"><rect x="514" y="545" width="170" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="599" y="574" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Rate limiter</text><text x="599" y="592" text-anchor="middle" font-size="12" fill="#4f5d5a">budget per caller</text></g><g class="dg-node" data-node="idp"><rect x="306" y="772" width="187" height="64" rx="6" fill="#ffffff" stroke="#b9c2bf" stroke-width="1.4"/><text x="399.5" y="801" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Identity provider</text><text x="399.5" y="819" text-anchor="middle" font-size="12" fill="#4f5d5a">issues tokens and keys</text></g><g class="dg-node" data-node="router"><rect x="814" y="393" width="234" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="931" y="422" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Router</text><text x="931" y="440" text-anchor="middle" font-size="12" fill="#4f5d5a">path, host or header → service</text></g><g class="dg-node" data-node="agg"><rect x="704" y="545" width="188" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="798" y="574" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Aggregator</text><text x="798" y="592" text-anchor="middle" font-size="12" fill="#4f5d5a">fan out, merge, reshape</text></g><g class="dg-node" data-node="obs"><rect x="912" y="545" width="194" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="1009" y="574" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Telemetry</text><text x="1009" y="592" text-anchor="middle" font-size="12" fill="#4f5d5a">logs, metrics, trace ids</text></g><g class="dg-node" data-node="metrics"><rect x="958" y="772" width="178" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="1047" y="801" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Metrics and logs</text><text x="1047" y="819" text-anchor="middle" font-size="12" fill="#4f5d5a">every request</text></g><g class="dg-node" data-node="orders"><rect x="100" y="772" width="170" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="185" y="801" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Order service</text><text x="185" y="819" text-anchor="middle" font-size="12" fill="#4f5d5a">private network only</text></g><g class="dg-node" data-node="catalogue"><rect x="529" y="772" width="187" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="622.5" y="801" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Catalogue service</text><text x="622.5" y="819" text-anchor="middle" font-size="12" fill="#4f5d5a">private network only</text></g><g class="dg-node" data-node="reviews"><rect x="752" y="772" width="170" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="837" y="801" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Reviews service</text><text x="837" y="819" text-anchor="middle" font-size="12" fill="#4f5d5a">private network only</text></g></g></svg>