<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 540" class="dg" data-diagram="strategies" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Three ways to map a key to a shard"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-edge" data-edge="g1" data-from="key" data-to="range"><path d="M 466 88 L 466 93 Q 466 98 461 98 L 179 98 Q 174 98 174 103 L 174 222" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="127.5" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">which range?</text></g><g class="dg-edge" data-edge="g2" data-from="key" data-to="hash"><path d="M 510 88 L 510 222" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="479.5" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">hash it</text></g><g class="dg-edge" data-edge="g3" data-from="key" data-to="dir"><path d="M 553 88 L 553 93 Q 553 98 558 98 L 841 98 Q 846 98 846 103 L 846 222" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="806" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">look it up</text></g><g class="dg-edge" data-edge="g4" data-from="range" data-to="shards"><path d="M 174 286 L 174 367 Q 174 372 179 372 L 452 372 Q 457 372 457 377 L 457 420" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="143.5" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">shard 1</text></g><g class="dg-edge" data-edge="g5" data-from="hash" data-to="shards"><path d="M 510 286 L 510 420" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="479.5" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">shard 3</text></g><g class="dg-edge" data-edge="g6" data-from="dir" data-to="shards"><path d="M 846 286 L 846 367 Q 846 372 841 372 L 569 372 Q 564 372 564 377 L 564 420" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="764.5" y="357" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">whatever the table says</text></g><g class="dg-node" data-node="key"><rect x="422" y="24" width="175" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="509.5" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Shard key value</text><text x="509.5" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">e.g. customer_id 4217</text></g><g class="dg-node" data-node="range"><rect x="24" y="222" width="300" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="174" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Range</text><text x="174" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">1–5,000 → shard 1; scans cheap, new keys pile up at the end</text></g><g class="dg-node" data-node="hash"><rect x="360" y="222" width="300" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="510" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Hash</text><text x="510" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">hash(key) → shard; even spread, ranges fan out</text></g><g class="dg-node" data-node="dir"><rect x="696" y="222" width="300" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="846" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Directory (lookup)</text><text x="846" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">a table says where; flexible, one more hop</text></g><g class="dg-node" data-node="shards"><rect x="403" y="420" width="214" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="510" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Shards</text><text x="510" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">same schema, different rows</text></g></g></svg>