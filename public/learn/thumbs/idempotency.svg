<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 540" class="dg" data-diagram="naive" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Check, then charge: two retries race"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-edge" data-edge="n1" data-from="a1" data-to="api"><path d="M 311 88 L 311 222" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="277.5" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">POST £20</text></g><g class="dg-edge" data-edge="n2" data-from="a2" data-to="api"><path d="M 519 88 L 519 93 Q 519 98 514 98 L 372 98 Q 367 98 367 103 L 367 222" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="421" y="159" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">retry POST £20</text></g><g class="dg-edge" data-edge="n3" data-from="api" data-to="db"><path d="M 288 286 L 288 420" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="155" y="357" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">any £20 charge in the last minute? none</text></g><g class="dg-edge" data-edge="n4" data-from="api" data-to="db"><path d="M 322 286 L 322 291 Q 322 296 317 296 L 308 296 Q 303 296 303 301 L 303 367 Q 303 372 308 372 L 339 372 Q 344 372 344 377 L 344 420" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="405" y="357" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">same check, same moment: none</text></g><g class="dg-edge" data-edge="n5" data-from="api" data-to="bank"><path d="M 356 286 L 356 301 Q 356 306 361 306 L 591 306 Q 596 306 596 311 L 596 367 Q 596 372 591 372 L 560 372 Q 555 372 555 377 L 555 420" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="556" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">charge £20</text></g><g class="dg-edge" data-edge="n6" data-from="api" data-to="bank"><path d="M 390 286 L 390 291 Q 390 296 395 296 L 606 296 Q 611 296 611 301 L 611 420" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="671" y="357" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">charge £20 again</text></g><g class="dg-node" data-node="a1"><rect x="223" y="24" width="175" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="310.5" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Attempt 1</text><text x="310.5" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">still running, slowly</text></g><g class="dg-node" data-node="a2"><rect x="434" y="24" width="170" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="519" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Attempt 2</text><text x="519" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">the retry</text></g><g class="dg-node" data-node="api"><rect x="254" y="222" width="170" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="339" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Payments API</text><text x="339" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">two instances</text></g><g class="dg-node" data-node="db"><rect x="231" y="420" width="170" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="316" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Charges table</text><text x="316" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">no unique rule</text></g><g class="dg-node" data-node="bank"><rect x="498" y="420" width="170" height="64" rx="6" fill="#ffffff" stroke="#b9c2bf" stroke-width="1.4"/><text x="583" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Card network</text><text x="583" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">moves the money</text></g></g></svg>