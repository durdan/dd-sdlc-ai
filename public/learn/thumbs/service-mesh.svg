<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 635 662" class="dg" data-diagram="sidecar" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A helper process next to every instance"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-group" data-group="pod"><rect x="158" y="112" width="318" height="310" rx="12" fill="none" stroke="#c5ccc9" stroke-dasharray="6 5"/><text x="172" y="134" class="dg-group-label" fill="#4f5d5a" font-size="13" font-weight="600">One instance [Kubernetes pod: shared network and lifecycle]</text></g><g class="dg-edge" data-edge="e1" data-from="caller" data-to="proxy"><path d="M 128 88 L 128 291 Q 128 296 133 296 L 236 296 Q 241 296 241 301 L 241 344" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="75" y="182" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">inbound · mTLS</text></g><g class="dg-edge" data-edge="e2" data-from="proxy" data-to="app"><path d="M 306 344 L 306 225 Q 306 220 301 220 L 290 220 Q 285 220 285 215 L 285 210" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="227.5" y="281" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">localhost · plain HTTP</text></g><g class="dg-edge" data-edge="e3" data-from="app" data-to="proxy"><path d="M 371 210 L 371 344" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="469.5" y="281" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">outbound call, via localhost</text></g><g class="dg-edge" data-edge="e4" data-from="proxy" data-to="payments"><path d="M 263 408 L 263 542" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="184.5" y="479" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">mTLS · retry · timeout</text></g><g class="dg-edge" data-edge="e5" data-from="proxy" data-to="telemetry"><path d="M 349 408 L 349 489 Q 349 494 354 494 L 477 494 Q 482 494 482 499 L 482 542" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="399.5" y="479" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">every request</text></g><g class="dg-node" data-node="caller"><rect x="43" y="24" width="170" height="64" rx="6" fill="#ffffff" stroke="#b9c2bf" stroke-width="1.4"/><text x="128" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Other services</text><text x="128" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">call orders</text></g><g class="dg-node" data-node="app"><rect x="198" y="146" width="260" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="328" y="175" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Orders app</text><text x="328" y="193" text-anchor="middle" font-size="12" fill="#4f5d5a">business logic only · any language</text></g><g class="dg-node" data-node="proxy"><rect x="176" y="344" width="260" height="64" rx="6" fill="#f4eddd" stroke="#8a6a2c" stroke-width="1.4"/><text x="306" y="373" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Sidecar proxy</text><text x="306" y="391" text-anchor="middle" font-size="12" fill="#4f5d5a">TLS · retries · timeouts · metrics</text></g><g class="dg-node" data-node="payments"><rect x="178" y="542" width="170" height="64" rx="6" fill="#ffffff" stroke="#b9c2bf" stroke-width="1.4"/><text x="263" y="571" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Payment service</text><text x="263" y="589" text-anchor="middle" font-size="12" fill="#4f5d5a">has its own sidecar</text></g><g class="dg-node" data-node="telemetry"><rect x="384" y="542" width="195" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="481.5" y="571" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Metrics and traces</text><text x="481.5" y="589" text-anchor="middle" font-size="12" fill="#4f5d5a">one format for everyone</text></g></g></svg>