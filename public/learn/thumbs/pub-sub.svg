<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1135 540" class="dg" data-diagram="direct" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The sender calls everyone who cares"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-edge" data-edge="d1" data-from="user" data-to="orders"><path d="M 544 88 L 544 222" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="501" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">place order</text></g><g class="dg-edge" data-edge="d2" data-from="orders" data-to="email"><path d="M 487 286 L 487 291 Q 487 296 482 296 L 120 296 Q 115 296 115 301 L 115 420" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="68.5" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">send receipt</text></g><g class="dg-edge" data-edge="d3" data-from="orders" data-to="inventory"><path d="M 516 286 L 516 301 Q 516 306 511 306 L 335 306 Q 330 306 330 311 L 330 420" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="280.5" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">reserve stock</text></g><g class="dg-edge" data-edge="d4" data-from="orders" data-to="analytics"><path d="M 544 286 L 544 420" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="501" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">record sale</text></g><g class="dg-edge" data-edge="d5" data-from="orders" data-to="loyalty"><path d="M 572 286 L 572 301 Q 572 306 577 306 L 709 306 Q 714 306 714 311 L 714 367 Q 714 372 719 372 L 745 372 Q 750 372 750 377 L 750 420" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="635.5" y="357" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">add points · waits 8 s</text></g><g class="dg-edge" data-edge="d6" data-from="orders" data-to="fraud"><path d="M 601 286 L 601 291 Q 601 296 606 296 L 970 296 Q 975 296 975 301 L 975 420" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="864.5" y="357" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">needs a code change and redeploy</text></g><g class="dg-node" data-node="user"><rect x="459" y="24" width="170" height="64" rx="22" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="544" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Customer</text><text x="544" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">places an order</text></g><g class="dg-node" data-node="orders"><rect x="459" y="222" width="170" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="544" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Order service</text><text x="544" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">knows every receiver</text></g><g class="dg-node" data-node="email"><rect x="30" y="420" width="170" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="115" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Email service</text><text x="115" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">sends the receipt</text></g><g class="dg-node" data-node="inventory"><rect x="236" y="420" width="187" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="329.5" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Inventory service</text><text x="329.5" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">reserves stock</text></g><g class="dg-node" data-node="analytics"><rect x="459" y="420" width="170" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="544" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Analytics</text><text x="544" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">counts sales</text></g><g class="dg-node" data-node="loyalty"><rect x="665" y="420" width="170" height="64" rx="6" fill="#ffffff" stroke="#b9c2bf" stroke-width="1.4"/><text x="750" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Loyalty service</text><text x="750" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">slow: 8 s</text></g><g class="dg-node" data-node="fraud"><rect x="871" y="420" width="208" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="975" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Fraud checks</text><text x="975" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">new team, wants orders too</text></g></g></svg>