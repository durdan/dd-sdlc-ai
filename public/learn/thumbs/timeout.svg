<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 544" class="dg" data-diagram="naive" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Thirty seconds, everywhere"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><line class="dg-lifeline" data-life="user" x1="125" y1="66" x2="125" y2="512" stroke="#d3d9d6" stroke-dasharray="3 4"/><line class="dg-lifeline" data-life="web" x1="335" y1="66" x2="335" y2="512" stroke="#d3d9d6" stroke-dasharray="3 4"/><line class="dg-lifeline" data-life="orders" x1="545" y1="66" x2="545" y2="512" stroke="#d3d9d6" stroke-dasharray="3 4"/><line class="dg-lifeline" data-life="stock" x1="755" y1="66" x2="755" y2="512" stroke="#d3d9d6" stroke-dasharray="3 4"/><g class="dg-edge" data-edge="n1" data-from="user" data-to="web"><path d="M 125 108 L 335 108" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="230" y="100" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">place order</text></g><g class="dg-edge" data-edge="n2" data-from="web" data-to="orders"><path d="M 335 156 L 545 156" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="440" y="148" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">reserve · timeout 30 s</text></g><g class="dg-edge" data-edge="n3" data-from="orders" data-to="stock"><path d="M 545 204 L 755 204" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="650" y="196" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">reserve · timeout 30 s</text></g><g class="dg-edge" data-edge="n4" data-from="web" data-to="user"><path d="M 335 252 L 125 252" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="230" y="244" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">30 s later: error</text></g><g class="dg-edge" data-edge="n5" data-from="user" data-to="web"><path d="M 125 300 L 335 300" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="230" y="292" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">user clicks again</text></g><g class="dg-edge" data-edge="n6" data-from="web" data-to="orders"><path d="M 335 348 L 545 348" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="440" y="340" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">second request</text></g><g class="dg-edge" data-edge="n7" data-from="orders" data-to="stock"><path d="M 545 396 L 755 396" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="650" y="388" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">second reserve: two in flight</text></g><g class="dg-edge" data-edge="n8" data-from="stock" data-to="orders"><path d="M 755 444 L 545 444" fill="non