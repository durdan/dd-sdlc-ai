<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 878 610" class="dg" data-diagram="structure" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Candidates, a lease, a leader, and a fenced resource"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-group" data-group="cands"><rect x="197" y="24" width="625" height="132" rx="12" fill="none" stroke="#c5ccc9" stroke-dasharray="6 5"/><text x="211" y="46" class="dg-group-label" fill="#4f5d5a" font-size="13" font-weight="600">Candidates [same code, any can lead]</text></g><g class="dg-group" data-group="coord"><rect x="318" y="300" width="370" height="254" rx="12" fill="none" stroke="#c5ccc9" stroke-dasharray="6 5"/><text x="332" y="322" class="dg-group-label" fill="#4f5d5a" font-size="13" font-weight="600">Coordination service [etcd, ZooKeeper, Kubernetes API]</text></g><g class="dg-edge" data-edge="s1" data-from="c1" data-to="lease"><path d="M 337.6666666666667 132 L 333 166 Q 338 171 340 171 L 340 171 Q 342 171 342 176 L 342 252 Q 342 257 347 257 L 515 257 Q 520 257 520 262 L 520 344" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="270" y="232" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">acquire · then renew</text></g><g class="dg-edge" data-edge="s2" data-from="c2" data-to="lease"><path d="M 707.5 132 L 703 156 Q 708 161 708 166 L 708 242 Q 708 247 703 247 L 619 247 Q 614 247 614 252 L 614 344" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="623" y="232" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">watch · try when expired</text></g><g class="dg-edge" data-edge="s3" data-from="c3" data-to="lease"><path d="M 506.5 132 L 502 156 Q 507 161 507 166 L 507 166 Q 507 171 512 171 L 520 171 Q 525 171 525 176 L 525 242 Q 525 247 530 247 L 562 247 Q 567 247 567 252 L 567 344" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="440" y="232" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">watch · try when expired</text></g><g class="dg-edge" data-edge="s4" data-from="lease" data-to="quorum"><path d="M 567 408 L 567 466" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="453.5" y="441" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">every change agreed by a majority</text></g><g class="dg-edge" data-edge="s5" data-from="c1" data-to="res"><path d="M 279.3333333333333 132 L 284 166 Q 279 171 274 171 L 190 171 Q 185 171 185 176 L 185 300" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="103.5" y="232" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">work + fencing token 34</text></g><g class="dg-node" data-node="c1"><rect x="221" y="68" width="175" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="308.5" y="97" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Replica 1</text><text x="308.5" y="115" text-anchor="middle" font-size="12" fill="#4f5d5a">leader · runs the job</text></g><g class="dg-node" data-node="c2"><rect x="617" y="68" width="181" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="707.5" y="97" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Replica 2</text><text x="707.5" y="115" text-anchor="middle" font-size="12" fill="#4f5d5a">follower · standing by</text></g><g class="dg-node" data-node="c3"><rect x="416" y="68" width="181" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="506.5" y="97" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Replica 3</text><text x="506.5" y="115" text-anchor="middle" font-size="12" fill="#4f5d5a">follower · standing by</text></g><g class="dg-node" data-node="lease"><rect x="473" y="344" width="188" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="567" y="373" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Lease record</text><text x="567" y="391" text-anchor="middle" font-size="12" fill="#4f5d5a">holder · expiry · token</text></g><g class="dg-node" data-node="quorum"><rect x="470" y="466" width="194" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="567" y="495" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Consensus</text><text x="567" y="513" text-anchor="middle" font-size="12" fill="#4f5d5a">majority of 3 or 5 nodes</text></g><g class="dg-node" data-node="res"><rect x="87" y="300" width="195" height="64" rx="6" fill="#ffffff" stroke="#b9c2bf" stroke-width="1.4"/><text x="184.5" y="329" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Protected resource</text><text x="184.5" y="347" text-anchor="middle" font-size="12" fill="#4f5d5a">rejects old tokens</text></g></g></svg>