<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 901 659" class="dg" data-diagram="shared" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="One deployment serves every customer"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-group" data-group="stack"><rect x="228" y="227" width="318.5" height="376" rx="12" fill="none" stroke="#c5ccc9" stroke-dasharray="6 5"/><text x="242" y="249" class="dg-group-label" fill="#4f5d5a" font-size="13" font-weight="600">One deployment [serves 100% of customers]</text></g><g class="dg-edge" data-edge="s1" data-from="custs" data-to="lb"><path d="M 145 88 L 145 169 Q 145 174 150 174 L 363 174 Q 368 174 373 179 L 368.33333333333337 271" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="111.5" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">requests</text></g><g class="dg-edge" data-edge="s2" data-from="lb" data-to="app"><path d="M 401.83333333333337 335 L 401.83333333333337 393" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="358.83333333333337" y="368" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">any replica</text></g><g class="dg-edge" data-edge="s3" data-from="app" data-to="db"><path d="M 432 457 L 432 515" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="341" y="490" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">shared tables and capacity</text></g><g class="dg-edge" data-edge="s4" data-from="pipeline" data-to="app"><path d="M 725 88 L 725 169 Q 725 174 720 174 L 517 174 Q 512 174 517 179 L 507.33333333333337 378 Q 512.3333333333334 383 507.33333333333337 383 L 467.1666666666667 383 Q 462.1666666666667 383 462.1666666666667 388 L 462.1666666666667 393" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="624" y="159" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">bad release: everyone at once</text></g><g class="dg-edge" data-edge="s5" data-from="noisy" data-to="lb"><path d="M 435 88 L 435.33333333333337 271" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="315" y="159" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">crashes or starves the shared fleet</text></g><g class="dg-node" data-node="custs"><rect x="24" y="24" width="241" height="64" rx="22" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="144.5" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Customers</text><text x="144.5" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">every customer, large and small</text></g><g class="dg-node" data-node="noisy"><rect x="301" y="24" width="267" height="64" rx="22" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="434.5" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">One customer</text><text x="434.5" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">a poison request or a traffic spike</text></g><g class="dg-node" data-node="pipeline"><rect x="604" y="24" width="241" height="64" rx="6" fill="#fbfbf9" stroke="#1d2826" stroke-width="2"/><text x="724.5" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Deploy pipeline</text><text x="724.5" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">ships each release to the fleet</text></g><g class="dg-node" data-node="lb"><rect x="301.33333333333337" y="271" width="201" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="401.83333333333337" y="300" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Load balancer</text><text x="401.83333333333337" y="318" text-anchor="middle" font-size="12" fill="#4f5d5a">any request to any server</text></g><g class="dg-node" data-node="app"><rect x="341.5" y="393" width="181" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="432" y="422" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">App services</text><text x="432" y="440" text-anchor="middle" font-size="12" fill="#4f5d5a">one fleet, one version</text></g><g class="dg-node" data-node="db"><rect x="344.5" y="515" width="175" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="432" y="544" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Database</text><text x="432" y="562" text-anchor="middle" font-size="12" fill="#4f5d5a">every customer's data</text></g></g></svg>