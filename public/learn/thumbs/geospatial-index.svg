<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 871 738" class="dg" data-diagram="naive" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Finding what is near me without a spatial index"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-edge" data-edge="q1" data-from="rider" data-to="app"><path d="M 494 88 L 494 222" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="451" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">find nearby</text></g><g class="dg-edge" data-edge="q2" data-from="app" data-to="table"><path d="M 433 286 L 433 291 Q 433 296 428 296 L 248 296 Q 243 296 243 301 L 243 420" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="132.5" y="357" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">distance to every row, then sort</text></g><g class="dg-edge" data-edge="q3" data-from="app" data-to="latidx"><path d="M 494 286 L 494 420" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="425" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">lat BETWEEN a AND b</text></g><g class="dg-edge" data-edge="q4" data-from="latidx" data-to="strip"><path d="M 494 484 L 494 618" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="367.5" y="555" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">every row in the band, all longitudes</text></g><g class="dg-edge" data-edge="q5" data-from="strip" data-to="app"><path d="M 569 618 L 569 575 Q 569 570 574 570 L 622 570 Q 627 570 627 565 L 627 301 Q 627 296 622 296 L 559 296 Q 554 296 554 291 L 554 286" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="722.5" y="456" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">filter longitude afterwards</text></g><g class="dg-node" data-node="rider"><rect x="390" y="24" width="208" height="64" rx="22" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="494" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Rider</text><text x="494" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">drivers within 1 km of me?</text></g><g class="dg-node" data-node="app"><rect x="373" y="222" width="241" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="493.5" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Nearby service</text><text x="493.5" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">plain SQL over lat, lng columns</text></g><g class="dg-node" data-node="table"><rect x="126" y="420" width="234" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="243" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Locations table</text><text x="243" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">every driver and shop on Earth</text></g><g class="dg-node" data-node="latidx"><rect x="396" y="420" width="195" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="493.5" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">B-tree on latitude</text><text x="493.5" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">one dimension at a time</text></g><g class="dg-node" data-node="strip"><rect x="418" y="618" width="227" height="64" rx="6" fill="#f4eddd" stroke="#8a6a2c" stroke-width="1.4"/><text x="531.5" y="647" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Latitude strip</text><text x="531.5" y="665" text-anchor="middle" font-size="12" fill="#4f5d5a">a band right round the planet</text></g></g></svg>