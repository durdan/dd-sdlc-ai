<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 885 750" class="dg" data-diagram="parts" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Log first, pages later"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-group" data-group="eng"><rect x="140" y="39" width="542" height="254" rx="12" fill="none" stroke="#c5ccc9" stroke-dasharray="6 5"/><text x="154" y="61" class="dg-group-label" fill="#4f5d5a" font-size="13" font-weight="600">Database engine [memory]</text></g><g class="dg-edge" data-edge="e1" data-from="client" data-to="buffer"><path d="M 697 630 L 697 587 Q 697 582 702 582 L 823 582 Q 828 582 828 577 L 828 29 Q 828 24 823 24 L 566 24 Q 561 24 561 29 L 561 83" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="785" y="369" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">change rows</text></g><g class="dg-edge" data-edge="e2" data-from="buffer" data-to="logbuf"><path d="M 561 147 L 561 205" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="489" y="180" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">describe each change</text></g><g class="dg-edge" data-edge="e3" data-from="logbuf" data-to="wal"><path d="M 561 269 L 561 432" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="647" y="369" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">append + fsync at commit</text></g><g class="dg-edge" data-edge="e4" data-from="wal" data-to="client"><path d="M 561 496 L 561 501 Q 561 506 566 506 L 636 506 Q 641 506 641 511 L 641 630" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="566" y="567" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">durable → acknowledge</text></g><g class="dg-edge" data-edge="e5" data-from="ckpt" data-to="data"><path d="M 257.3333333333333 269 L 262 303 Q 257 308 252 308 L 190 308 Q 185 308 185 313 L 185 577 Q 185 582 190 582 L 378 582 Q 383 582 383 587 L 383 630" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="103.5" y="468" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">write dirty pages later</text></g><g class="dg-edge" data-edge="e6" data-from="ckpt" data-to="wal"><path d="M 350.66666666666663 269 L 346 303 Q 351 308 356 308 L 473 308 Q 478 308 478 313 L 478 432" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="342" y="369" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">checkpoint record · recycle old segments</text></g><g class="dg-edge" data-edge="e7" data-from="wal" data-to="data"><path d="M 478 496 L 478 577 Q 478 582 473 582 L 471 582 Q 466 582 466 587 L 466 630" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="342" y="567" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">rule: log record on disk before its page</text></g><g class="dg-node" data-node="client"><rect x="584" y="630" width="170" height="64" rx="22" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="669" y="659" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Application</text><text x="669" y="677" text-anchor="middle" font-size="12" fill="#4f5d5a">sends COMMIT</text></g><g class="dg-node" data-node="buffer"><rect x="467" y="83" width="188" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="561" y="112" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Buffer pool</text><text x="561" y="130" text-anchor="middle" font-size="12" fill="#4f5d5a">pages changed in memory</text></g><g class="dg-node" data-node="logbuf"><rect x="464" y="205" width="194" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="561" y="234" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Log buffer</text><text x="561" y="252" text-anchor="middle" font-size="12" fill="#4f5d5a">change records, in order</text></g><g class="dg-node" data-node="ckpt"><rect x="164" y="205" width="280" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="304" y="234" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Checkpointer</text><text x="304" y="252" text-anchor="middle" font-size="12" fill="#4f5d5a">flushes dirty pages in the background</text></g><g class="dg-node" data-node="wal"><rect x="396" y="432" width="247" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="519.5" y="461" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Write-ahead log</text><text x="519.5" y="479" text-anchor="middle" font-size="12" fill="#4f5d5a">append-only, sequential segments</text></g><g class="dg-node" data-node="data"><rect x="301" y="630" width="247" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="424.5" y="659" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Data files</text><text x="424.5" y="677" text-anchor="middle" font-size="12" fill="#4f5d5a">tables and indexes, random pages</text></g></g></svg>