<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1058 816" class="dg" data-diagram="structure" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="One queue, a pool of competing workers"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-group" data-group="pool"><rect x="325" y="425" width="609" height="132" rx="12" fill="none" stroke="#c5ccc9" stroke-dasharray="6 5"/><text x="339" y="447" class="dg-group-label" fill="#4f5d5a" font-size="13" font-weight="600">Worker pool [scales on its own]</text></g><g class="dg-edge" data-edge="p1" data-from="web" data-to="queue"><path d="M 557 88 L 557 222" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="478.5" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">enqueue job, reply 202</text></g><g class="dg-edge" data-edge="p2" data-from="queue" data-to="w1"><path d="M 630 286 L 634.5 415 Q 629.5 420 629.5 425 L 629.5 469" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="593" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">message A</text></g><g class="dg-edge" data-edge="p3" data-from="queue" data-to="w2"><path d="M 576 286 L 576 301 Q 576 306 571 306 L 439 306 Q 434 306 434 311 L 434 469" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="397" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">message B</text></g><g class="dg-edge" data-edge="p4" data-from="queue" data-to="w3"><path d="M 685 286 L 685 291 Q 685 296 690 296 L 792 296 Q 797 296 792 301 L 796.6666666666667 469" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="760" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">message C</text></g><g class="dg-edge" data-edge="p5" data-from="w1" data-to="out"><path d="M 629.5 533 L 625 557 Q 630 562 630 567 L 630 696" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="583.5" y="633" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">write result</text></g><g class="dg-edge" data-edge="p6" data-from="scaler" data-to="queue"><path d="M 797 88 L 797 169 Q 797 174 792 174 L 654 174 Q 649 174 649 179 L 649 222" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="738" y="159" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">read queue depth</text></g><g class="dg-edge" data-edge="p7" data-from="scaler" data-to="w3"><path d="M 853 88 L 853.3333333333333 469" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="929" y="258" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">add or remove workers</text></g><g class="dg-edge" data-edge="p8" data-from="queue" data-to="dlq"><path d="M 521 286 L 521 291 Q 521 296 516 296 L 190 296 Q 185 296 185 301 L 185 425" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="103.5" y="357" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">after N failed receives</text></g><g class="dg-node" data-node="web"><rect x="469" y="24" width="175" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="556.5" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Web app</text><text x="556.5" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">any instance enqueues</text></g><g class="dg-node" data-node="queue"><rect x="466" y="222" width="274" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="603" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Work queue</text><text x="603" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">durable · each message to one worker</text></g><g class="dg-node" data-node="w1"><rect x="539" y="469" width="181" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="629.5" y="498" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Worker 1</text><text x="629.5" y="516" text-anchor="middle" font-size="12" fill="#4f5d5a">takes the next message</text></g><g class="dg-node" data-node="w2"><rect x="349" y="469" width="170" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="434" y="498" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Worker 2</text><text x="434" y="516" text-anchor="middle" font-size="12" fill="#4f5d5a">identical copy</text></g><g class="dg-node" data-node="w3"><rect x="740" y="469" width="170" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="825" y="498" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Worker 3</text><text x="825" y="516" text-anchor="middle" font-size="12" fill="#4f5d5a">identical copy</text></g><g class="dg-node" data-node="out"><rect x="533" y="696" width="194" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="630" y="725" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Results</text><text x="630" y="743" text-anchor="middle" font-size="12" fill="#4f5d5a">image store · email sent</text></g><g class="dg-node" data-node="scaler"><rect x="740" y="24" width="170" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="825" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Autoscaler</text><text x="825" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">e.g. KEDA</text></g><g class="dg-node" data-node="dlq"><rect x="81" y="425" width="208" height="64" rx="6" fill="#f4eddd" stroke="#8a6a2c" stroke-width="1.4"/><text x="185" y="454" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Dead-letter queue</text><text x="185" y="472" text-anchor="middle" font-size="12" fill="#4f5d5a">messages that keep failing</text></g></g></svg>