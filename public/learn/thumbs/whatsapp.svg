"dg-edge-label" x="1047.5" y="258" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">sync settings</text></g><g class="dg-node" data-node="phone"><rect x="474" y="24" width="234" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="591" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Primary phone app</text><text x="591" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">Signal Protocol, local history</text></g><g class="dg-node" data-node="companion"><rect x="821" y="24" width="234" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="938" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Linked devices</text><text x="938" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">web, desktop · own keys (2021)</text></g><g class="dg-node" data-node="chat"><rect x="315" y="222" width="293" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="461.5" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Chat servers</text><text x="461.5" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">Erlang, FreeBSD (2014) · one per device</text></g><g class="dg-node" data-node="keys"><rect x="183" y="466" width="214" height="64" rx="6" fill="#f4eddd" stroke="#8a6a2c" stroke-width="1.4"/><text x="290" y="495" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Key distribution</text><text x="290" y="513" text-anchor="middle" font-size="12" fill="#4f5d5a">public identity and prekeys</text></g><g class="dg-node" data-node="groupsvc"><rect x="715" y="466" width="208" height="64" rx="6" fill="#f4eddd" stroke="#8a6a2c" stroke-width="1.4"/><text x="819" y="495" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Group service</text><text x="819" y="513" text-anchor="middle" font-size="12" fill="#4f5d5a">membership, server fan-out</text></g><g class="dg-node" data-node="pushgw"><rect x="485" y="466" width="194" height="64" rx="6" fill="#f4eddd" stroke="#8a6a2c" stroke-width="1.4"/><text x="582" y="495" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Push gateway</text><text x="582" y="513" text-anchor="middle" font-size="12" fill="#4f5d5a">wake apps · illustrative</text></g><g class="dg-node" data-node="media"><rect x="805" y="344" width="170" height="64" rx="6" fill="#f4eddd" stroke="#8a6a2c" stroke-width="1.4"/><text x="890" y="373" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Media servers</text><text x="890" y="391" text-anchor="middle" font-size="12" fill="#4f5d5a">encrypted blob store</text></g><g class="dg-node" data-node="accounts"><rect x="54" y="588" width="212" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="160" y="617" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Accounts and devices</text><text x="160" y="635" text-anchor="middle" font-size="12" fill="#4f5d5a">device lists, signatures</text></g><g class="dg-node" data-node="offline"><rect x="338" y="588" width="247" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="461.5" y="617" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Offline store</text><text x="461.5" y="635" text-anchor="middle" font-size="12" fill="#4f5d5a">queued ciphertext, up to 30 days</text></g><g class="dg-node" data-node="appstate"><rect x="863" y="588" width="267" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="996.5" y="617" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">App-state store</text><text x="996.5" y="635" text-anchor="middle" font-size="12" fill="#4f5d5a">encrypted contacts, archives, stars</text></g></g></svg>