<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 592" class="dg" data-diagram="bigbang" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The big-bang rewrite"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><line class="dg-lifeline" data-life="biz" x1="125" y1="66" x2="125" y2="560" stroke="#d3d9d6" stroke-dasharray="3 4"/><line class="dg-lifeline" data-life="old" x1="335" y1="66" x2="335" y2="560" stroke="#d3d9d6" stroke-dasharray="3 4"/><line class="dg-lifeline" data-life="new" x1="545" y1="66" x2="545" y2="560" stroke="#d3d9d6" stroke-dasharray="3 4"/><line class="dg-lifeline" data-life="users" x1="755" y1="66" x2="755" y2="560" stroke="#d3d9d6" stroke-dasharray="3 4"/><g class="dg-edge" data-edge="b1" data-from="biz" data-to="new"><path d="M 125 108 L 545 108" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="335" y="100" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">start rewrite: “eighteen months”</text></g><g class="dg-edge" data-edge="b2" data-from="biz" data-to="old"><path d="M 125 156 L 335 156" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="230" y="148" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">freeze new features</text></g><g class="dg-edge" data-edge="b3" data-from="users" data-to="biz"><path d="M 755 204 L 125 204" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="440" y="196" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">we need a new returns policy now</text></g><g class="dg-edge" data-edge="b4" data-from="biz" data-to="old"><path d="M 125 252 L 335 252" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="230" y="244" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">build it in the old system anyway</text></g><g class="dg-edge" data-edge="b5" data-from="biz" data-to="new"><path d="M 125 300 L 545 300" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="335" y="292" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">…and again in the rewrite</text></g><g class="dg-edge" data-edge="b6" data-from="new" data-to="old"><path d="M 545 348 L 335 348" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="440" y="340" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">rediscover undocumented behaviour</text></g><g class="dg-edge" data-edge="b7" data-from="new" data-to="users"><path d="M 545 396 L 755 396" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="650" y="388" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">cut-over weekend, year three</text></g><g class="dg-edge" data-edge="b8" data-from="users" data-to="new"><path d="M 755 444 L 545 444" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="650" y="436" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">missing behaviour found in production</text></g><g class="dg-edge" data-edge="b9" data-from="new" data-to="old"><path d="M 545 492 L 335 492" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="440" y="484" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">roll back? data has already moved</text></g><g class="dg-node" data-node="biz"><rect x="30" y="20" width="190" height="46" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="125" y="48" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">The business</text></g><g class="dg-node" data-node="old"><rect x="240" y="20" width="190" height="46" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="335" y="48" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Old system</text></g><g class="dg-node" data-node="new"><rect x="450" y="20" width="190" height="46" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="545" y="48" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Rewrite</text></g><g class="dg-node" data-node="users"><rect x="660" y="20" width="190" height="46" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="755" y="48" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Users</text></g></g></svg>