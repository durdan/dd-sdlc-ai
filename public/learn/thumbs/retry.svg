<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 882 540" class="dg" data-diagram="related" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Related patterns"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-edge" data-edge="r1" data-from="timeout" data-to="retry"><path d="M 149 88 L 149 169 Q 149 174 154 174 L 306 174 Q 311 174 311 179 L 311 222" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="86.5" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">feeds it failures</text></g><g class="dg-edge" data-edge="r2" data-from="idem" data-to="retry"><path d="M 383 88 L 383 222" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="320.5" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">makes writes safe</text></g><g class="dg-edge" data-edge="r3" data-from="retry" data-to="cb"><path d="M 311 286 L 311 291 Q 311 296 306 296 L 133 296 Q 128 296 128 301 L 128 420" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="75" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">stop when open</text></g><g class="dg-edge" data-edge="r4" data-from="rl" data-to="retry"><path d="M 640 88 L 640 169 Q 640 174 635 174 L 460 174 Q 455 174 455 179 L 455 222" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="581" y="159" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">how long to wait</text></g><g class="dg-edge" data-edge="r5" data-from="retry" data-to="hedge"><path d="M 383 286 L 383 420" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="314" y="357" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">cousin: for latency</text></g><g class="dg-edge" data-edge="r6" data-from="retry" data-to="dlq"><path d="M 455 286 L 455 291 Q 455 296 460 296 L 684 296 Q 689 296 689 301 L 689 420" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="610.5" y="357" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">for work that can wait</text></g><g class="dg-node" data-node="retry"><rect x="239" y="222" width="288" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="383" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Retry with backoff and jitter</text><text x="383" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">for brief faults</text></g><g class="dg-node" data-node="timeout"><rect x="35" y="24" width="227" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="148.5" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Timeout</text><text x="148.5" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">decides an attempt has failed</text></g><g class="dg-node" data-node="idem"><rect x="298" y="24" width="170" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="383" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Idempotency key</text><text x="383" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">makes a retry safe</text></g><g class="dg-node" data-node="cb"><rect x="43" y="420" width="170" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="128" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Circuit breaker</text><text x="128" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">for long faults</text></g><g class="dg-node" data-node="rl"><rect x="504" y="24" width="271" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="639.5" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Rate limiting · Retry-After</text><text x="639.5" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">the server says when</text></g><g class="dg-node" data-node="hedge"><rect x="249" y="420" width="267" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="382.5" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Hedged requests</text><text x="382.5" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">a second try before the first fails</text></g><g class="dg-node" data-node="dlq"><rect x="552" y="420" width="274" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="689" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Queue with dead-letter</text><text x="689" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">retry later, out of the request path</text></g></g></svg>