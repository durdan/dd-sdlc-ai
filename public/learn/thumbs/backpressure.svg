<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 801 738" class="dg" data-diagram="structure" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Bounded buffer plus a demand signal"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-edge" data-edge="s0" data-from="source" data-to="producer"><path d="M 454 484 L 454 618" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="504.5" y="555" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">events arrive</text></g><g class="dg-edge" data-edge="s1" data-from="producer" data-to="buffer"><path d="M 341 618 L 341 585 Q 341 580 336 580 L 152 580 Q 147 580 147 575 L 147 103 Q 147 98 152 98 L 208 98 Q 213 98 213 93 L 213 88" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="84.5" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">send up to demand</text></g><g class="dg-edge" data-edge="s2" data-from="buffer" data-to="consumer"><path d="M 255 88 L 255 222" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="224.5" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">deliver</text></g><g class="dg-edge" data-edge="s3" data-from="consumer" data-to="producer"><path d="M 255 286 L 255 291 Q 255 296 250 296 L 182 296 Q 177 296 177 301 L 177 565 Q 177 570 182 570 L 393 570 Q 398 570 398 575 L 398 618" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="256.5" y="456" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">demand: send me n more</text></g><g class="dg-edge" data-edge="s4" data-from="buffer" data-to="policy"><path d="M 298 88 L 298 93 Q 298 98 303 98 L 488 98 Q 493 98 493 103 L 493 222" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="472" y="159" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">full</text></g><g class="dg-edge" data-edge="s5" data-from="policy" data-to="source"><path d="M 454 286 L 454 420" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="379" y="357" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">block, reject or drop</text></g><g class="dg-edge" data-edge="s6" data-from="policy" data-to="metrics"><path d="M 532 286 L 532 291 Q 532 296 537 296 L 655 296 Q 660 296 660 301 L 660 420" fill="none" stroke="#6b7875" stroke-width="1.6" stroke-dasharray="2 3" marker-end="url(#arr-dotted)"/><text class="dg-edge-label" x="569" y="357" text-anchor="middle" font-size="12" fill="#6b7875" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">record every drop and wait</text></g><g class="dg-node" data-node="source"><rect x="369" y="420" width="170" height="64" rx="6" fill="#ffffff" stroke="#b9c2bf" stroke-width="1.4"/><text x="454" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Event source</text><text x="454" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">cannot always wait</text></g><g class="dg-node" data-node="producer"><rect x="284" y="618" width="227" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="397.5" y="647" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Producer</text><text x="397.5" y="665" text-anchor="middle" font-size="12" fill="#4f5d5a">sends only what was asked for</text></g><g class="dg-node" data-node="buffer"><rect x="170" y="24" width="170" height="64" rx="6" fill="#eef1f6" stroke="#56657c" stroke-width="1.4"/><text x="255" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Bounded buffer</text><text x="255" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">capacity 1,000</text></g><g class="dg-node" data-node="consumer"><rect x="170" y="222" width="170" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="255" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Consumer</text><text x="255" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">sets the pace</text></g><g class="dg-node" data-node="policy"><rect x="376" y="222" width="234" height="64" rx="6" fill="#f4eddd" stroke="#8a6a2c" stroke-width="1.4"/><text x="493" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Overflow policy</text><text x="493" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">block · drop · latest · reject</text></g><g class="dg-node" data-node="metrics"><rect x="575" y="420" width="170" height="64" rx="6" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="660" y="449" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Metrics</text><text x="660" y="467" text-anchor="middle" font-size="12" fill="#4f5d5a">depth, drops, waits</text></g></g></svg>