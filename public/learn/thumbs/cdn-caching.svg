<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 817 540" class="dg" data-diagram="far" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Every request crosses the world to one origin"><style>.dg-edge-label{display:none}</style><defs><marker id="arr-solid" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#3d6b63"/></marker><marker id="arr-dashed" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#8a6a2c"/></marker><marker id="arr-dotted" viewBox="0 0 8 8" refX="7.2" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.6 L7.4 4 L0 7.4 z" fill="#6b7875"/></marker></defs><g transform="translate(16 16)"><g class="dg-edge" data-edge="f1" data-from="sydney" data-to="origin"><path d="M 230 88 L 230 169 Q 230 174 235 174 L 401 174 Q 406 174 406 179 L 406 222" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="126" y="159" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">each request · long round trip</text></g><g class="dg-edge" data-edge="f2" data-from="london" data-to="origin"><path d="M 457 88 L 457 222" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="350" y="159" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">each request · short round trip</text></g><g class="dg-edge" data-edge="f3" data-from="origin" data-to="db"><path d="M 457 286 L 457 420" fill="none" stroke="#3d6b63" stroke-width="1.6" marker-end="url(#arr-solid)"/><text class="dg-edge-label" x="394.5" y="357" text-anchor="middle" font-size="12" fill="#3d6b63" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">same query, again</text></g><g class="dg-edge" data-edge="f4" data-from="crowd" data-to="origin"><path d="M 672 88 L 672 169 Q 672 174 667 174 L 512 174 Q 507 174 507 179 L 507 222" fill="none" stroke="#8a6a2c" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-dashed)"/><text class="dg-edge-label" x="571" y="159" text-anchor="middle" font-size="12" fill="#8a6a2c" paint-order="stroke" stroke="#f4f5f2" stroke-width="5">same logo and page, 100× over</text></g><g class="dg-node" data-node="sydney"><rect x="145" y="24" width="170" height="64" rx="22" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="230" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Users in Sydney</text><text x="230" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">far from the origin</text></g><g class="dg-node" data-node="london"><rect x="372" y="24" width="170" height="64" rx="22" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="457" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Users in London</text><text x="457" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">near the origin</text></g><g class="dg-node" data-node="crowd"><rect x="583" y="24" width="178" height="64" rx="22" fill="#fbfbf9" stroke="#c9d0cd" stroke-width="1.4"/><text x="672" y="53" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Launch-day crowd</text><text x="672" y="71" text-anchor="middle" font-size="12" fill="#4f5d5a">everyone at once</text></g><g class="dg-node" data-node="origin"><rect x="356" y="222" width="201" height="64" rx="6" fill="#e6efec" stroke="#3d6b63" stroke-width="1.4"/><text x="456.5" y="251" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1d2826">Origin</text><text x="456.5" y="269" text-anchor="middle" font-size="12" fill="#4f5d5a">app servers in one region</text></g><g class="dg-node" data-no